# Context-menu templates. Each menu id matches a widget-owned menu;
# `action` ids are mapped to lambdas in the widget code — unknown ids
# are skipped (with a note), missing menus fall back to the compiled
# item order. `separator: true` rows draw a divider; `danger` tints
# the row red. Dynamic groups (plugin lists, speed rates) are emitted
# by the widget at the position of their `*_group` placeholder.
Menus:
  - id: media_bin.item
    items:
      - {action: bin.add_to_timeline, label: "Add to Timeline", icon: bin.add}
      - {action: bin.reveal, label: "Reveal in Explorer"}
      - {action: bin.remove, label: "Remove from Bin", icon: action.delete, danger: true}
      - {separator: true}
      - {action: bin.import, label: "Import Media…", icon: bin.import}
      - {separator: true}
      - {action: bin.detect_beats, label: "Detect Beats → Markers"}
      - {action: bin.transcribe, label: "Transcribe → Markers (Whisper)"}
      - {action: bin.audio_fx_group}   # expands into per-plugin bounce items

  - id: monitor
    items:
      - {action: monitor.play_pause, label: "Play", icon: transport.play, shortcut: "Space"}
      - {separator: true}
      - {action: monitor.loop, label: "Loop Playback", icon: transport.loop}
      - {separator: true}
      - {action: monitor.safe_margins, label: "Safe Margins"}
      - {action: monitor.grid, label: "Grid"}
      - {separator: true}
      - {action: monitor.toggle_focus, label: "Toggle Monitor Focus"}
      - {action: monitor.toggle_scopes, label: "Toggle Scopes"}

  - id: timeline.track
    items:
      - {action: track.toggle_mute_or_hide, label: "Mute Track"}
      - {action: track.toggle_lock, label: "Lock Track"}

  - id: timeline.marker
    items:
      - {action: marker.clear, label: "Clear Marker", danger: true}
      - {action: marker.add, label: "Add Marker Here"}

  - id: timeline.ruler
    items:
      - {action: marker.add, label: "Add Marker Here"}
      - {separator: true}
      - {action: workarea.set_in, label: "Set Work Area In"}
      - {action: workarea.set_out, label: "Set Work Area Out"}
      - {action: workarea.reset, label: "Reset Work Area"}

  - id: timeline.clip
    items:
      - {action: clip.split, label: "Split at Cursor", shortcut: "C"}
      - {separator: true}
      - {action: clip.speed_group}      # expands into Speed 50/100/200%
      - {separator: true}
      - {action: clip.delete, label: "Delete", shortcut: "Del", danger: true}
      - {action: clip.ripple_delete, label: "Ripple Delete", danger: true}

  - id: timeline.empty
    items:
      - {action: marker.add, label: "Add Marker at Cursor"}
