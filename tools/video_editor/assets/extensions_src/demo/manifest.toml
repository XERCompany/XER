[extension]
id = "demo"
name = "Demo Extension"
version = "1.0"
entry = "main.js"
ui = "static/index.html"

[files]
requires = ["scripts/helper.js", "static/index.html", "static/style.css"]

[native]
dlls = []
lua = []
py = []
# JIT-compilable C++ sources — ztzmake compiles each into
# mobjective/<stem>.xsjo inside the .xexrj. Must stay an array: the
# extension host rejects non-array values in [native].
sources = ["native/hello.cc"]

[pack]
# Packer-only options (ignored by the extension host).
# keep_sources = true would also pack the raw .cc next to the .xsjo.
keep_sources = false
